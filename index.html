<style>
  :root{
    --paper:#EEF1F6;
    --card:#FFFFFF;
    --ink:#0F1A2E;
    --ink-soft:#55637C;
    --rule:#D2D9E4;
    --now:#0C6E5C;
    --now-wash:#E2F0EC;
    --due:#9E2318;
    --due-wash:#FBEAE7;

    --sans:"Archivo",system-ui,sans-serif;
    --serif:"Source Serif 4",Georgia,serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;

    --gap:clamp(1.25rem,3vw,2rem);
    --rail:2px;
  }

  *,*::before,*::after{box-sizing:border-box}

  html{-webkit-text-size-adjust:100%}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    font-size:clamp(1rem,0.97rem + 0.15vw,1.0625rem);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:64rem;margin:0 auto;padding:0 var(--gap)}

  a{color:inherit}
  a:focus-visible,button:focus-visible{
    outline:2px solid var(--now);
    outline-offset:3px;
    border-radius:2px;
  }

  .eyebrow{
    font-family:var(--mono);
    font-size:0.7rem;
    letter-spacing:0.11em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0;
  }

  /* ---------- en-tête ---------- */
  .masthead{padding:clamp(2.5rem,6vw,4.5rem) 0 clamp(1.5rem,3vw,2.5rem)}

  .masthead h1{
    font-family:var(--sans);
    font-weight:700;
    font-size:clamp(2rem,1.3rem + 3.4vw,3.5rem);
    letter-spacing:-0.032em;
    line-height:1.02;
    margin:0.55rem 0 0;
    max-width:20ch;
  }

  .facts{
    display:flex;
    flex-wrap:wrap;
    gap:0.4rem 2rem;
    margin:1.5rem 0 0;
    padding:0;
    list-style:none;
    font-family:var(--mono);
    font-size:0.8rem;
    color:var(--ink-soft);
  }
  .facts b{
    display:block;
    font-weight:500;
    font-size:0.66rem;
    letter-spacing:0.11em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:0.45;
    margin-bottom:0.15rem;
  }

  /* ---------- bandeau de situation (« où en est-on ? ») ---------- */
  .status{
    background:var(--card);
    border:1px solid var(--rule);
    border-left:3px solid var(--now);
    padding:1.15rem 1.35rem;
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:0.35rem 1.5rem;
  }
  .status.is-pre{border-left-color:var(--ink-soft)}
  .status-main{
    font-family:var(--sans);
    font-weight:600;
    font-size:1.05rem;
    letter-spacing:-0.01em;
    margin:0;
  }
  .status-sub{margin:0;color:var(--ink-soft);font-size:0.95rem}
  .status-sub .due-in{color:var(--due);font-weight:600}

  /* ---------- sections ---------- */
  section{padding:clamp(2.75rem,6vw,4.25rem) 0}
  section + section{border-top:1px solid var(--rule)}

  h2{
    font-family:var(--sans);
    font-weight:600;
    font-size:1.5rem;
    letter-spacing:-0.02em;
    margin:0.4rem 0 1.75rem;
  }

  .lede{max-width:62ch;color:var(--ink-soft);margin:-1rem 0 2rem}

  /* ---------- calendrier ---------- */
  .schedule{list-style:none;margin:0;padding:0;position:relative}
  .schedule::before{
    content:"";
    position:absolute;
    left:calc(2.25rem - var(--rail)/2);
    top:0.7rem;bottom:0.7rem;
    width:var(--rail);
    background:var(--rule);
  }

  .week{
    position:relative;
    display:grid;
    grid-template-columns:4.5rem 1fr;
    gap:0 1.5rem;
    padding:0 0 1.75rem;
  }
  .week:last-child{padding-bottom:0}

  .week-mark{
    position:relative;
    z-index:1;
    grid-column:1;
    font-family:var(--mono);
    font-size:0.72rem;
    color:var(--ink-soft);
    text-align:center;
    padding-top:0.15rem;
  }
  .week-dot{
    display:block;
    width:0.7rem;height:0.7rem;
    margin:0.35rem auto 0.5rem;
    border-radius:50%;
    background:var(--paper);
    box-shadow:0 0 0 var(--rail) var(--rule) inset, 0 0 0 4px var(--paper);
  }

  .week-body{
    grid-column:2;
    background:var(--card);
    border:1px solid var(--rule);
    padding:1.15rem 1.3rem;
  }

  .week h3{
    font-family:var(--sans);
    font-weight:600;
    font-size:1.12rem;
    letter-spacing:-0.012em;
    margin:0;
  }
  .week p{margin:0.45rem 0 0;color:var(--ink-soft);max-width:60ch}

  .week-td{
    margin:0.85rem 0 0;
    padding-top:0.7rem;
    border-top:1px solid var(--rule);
    max-width:60ch;
  }
  .week-td b{
    font-family:var(--mono);
    font-weight:500;
    font-size:0.66rem;
    letter-spacing:0.11em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:0.45;
    display:block;
    margin-bottom:0.2rem;
  }
  .week.is-now .week-td{border-top-color:#BFD9D2}

  .week-links{
    display:flex;
    flex-wrap:wrap;
    gap:0.5rem;
    margin-top:0.95rem;
  }
  .week-links a{
    font-family:var(--mono);
    font-size:0.74rem;
    text-decoration:none;
    padding:0.32rem 0.6rem;
    border:1px solid var(--rule);
    color:var(--ink);
    transition:background 0.14s ease,border-color 0.14s ease;
  }
  .week-links a:hover{background:var(--ink);border-color:var(--ink);color:var(--card)}

  /* séance en cours */
  .week.is-now .week-dot{
    background:var(--now);
    box-shadow:0 0 0 var(--rail) var(--now) inset, 0 0 0 4px var(--paper);
  }
  .week.is-now .week-mark{color:var(--now)}
  .week.is-now .week-body{
    border-color:var(--now);
    background:var(--now-wash);
  }
  .now-tag{
    display:inline-block;
    font-family:var(--mono);
    font-size:0.6rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--now);
    margin-bottom:0.4rem;
  }

  .week.is-past .week-body{opacity:0.62}
  .week.is-past:hover .week-body{opacity:1}

  /* ---------- exercices ---------- */
  .assignments{list-style:none;margin:0;padding:0;display:grid;gap:1rem}
  .assignment{
    background:var(--card);
    border:1px solid var(--rule);
    padding:1.2rem 1.35rem;
    display:grid;
    grid-template-columns:1fr auto;
    gap:0.5rem 1.5rem;
    align-items:start;
  }
  .assignment h3{
    font-family:var(--sans);
    font-weight:600;
    font-size:1.08rem;
    margin:0;
    letter-spacing:-0.012em;
  }
  .assignment p{margin:0.4rem 0 0;color:var(--ink-soft);max-width:58ch}
  .assignment-due{
    grid-column:1;
    font-family:var(--mono);
    font-size:0.74rem;
    color:var(--due);
    margin-top:0.7rem;
  }
  .assignment-due.is-closed{color:var(--ink-soft)}
  .btn{
    grid-column:2;
    grid-row:1 / span 3;
    align-self:center;
    font-family:var(--sans);
    font-weight:600;
    font-size:0.85rem;
    text-decoration:none;
    padding:0.55rem 1.05rem;
    background:var(--ink);
    color:var(--card);
    white-space:nowrap;
    transition:background 0.14s ease;
  }
  .btn:hover{background:var(--now)}
  .btn[aria-disabled="true"]{
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--rule);
    pointer-events:none;
  }

  /* ---------- blocs de texte ---------- */
  .cols{display:grid;gap:2rem;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr))}
  .cols h3{font-family:var(--sans);font-weight:600;font-size:1rem;margin:0 0 0.5rem;letter-spacing:-0.01em}
  .cols p{margin:0 0 0.75rem;color:var(--ink-soft)}
  .cols code{font-family:var(--mono);font-size:0.85em;background:var(--card);padding:0.1em 0.35em;border:1px solid var(--rule)}
  .cols a{color:var(--now);text-underline-offset:0.15em}

  footer{
    border-top:1px solid var(--rule);
    padding:2rem 0 3rem;
    font-family:var(--mono);
    font-size:0.74rem;
    color:var(--ink-soft);
  }
  footer a{color:inherit}

  /* ---------- petits écrans ---------- */
  @media (max-width:34rem){
    .schedule::before{left:calc(1.4rem - var(--rail)/2)}
    .week{grid-template-columns:2.8rem 1fr;gap:0 0.9rem}
    .week-mark{font-size:0.65rem}
    .assignment{grid-template-columns:1fr}
    .btn{grid-column:1;grid-row:auto;justify-self:start;margin-top:0.5rem}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>

<script>
/* -------------------------------------------------------------------------

/* -------------------------------------------------------------------------

   Un bloc par séance. `date` est le lundi de la semaine concernée.
   `links` peut rester vide : []  — les ajouter à mesure que le matériel existe.

   Comment écrire les liens :
     PDF          -> un chemin relatif simple :  "slides/01-intro.pdf"
     .md, .ipynb  -> utiliser REPO + "/blob/main/notebooks/02-data.ipynb"
   GitHub Pages sert les fichiers markdown et les notebooks en texte brut,
   ce qui est illisible. Le lien REPO ouvre le même fichier sur github.com,

const SCHEDULE = [

    td: "Travail / inégalités — Données de salaires : top-coding, salaires nuls, temps partiels mal renseignés. Mesurer l'effet de chaque décision de nettoyage.",

  },
  {

/* -------------------------------------------------------------------------
   3. FORMAT DES TRAVAUX DIRIGÉS
   Bloc affiché sous le calendrier. Texte simple ; le HTML de base fonctionne.

   ------------------------------------------------------------------------- */
const TD_FORMAT = [
  {

/* -------------------------------------------------------------------------
   4. INFORMATIONS PRATIQUES
   Texte simple. Le HTML de base — <a href="...">liens</a> et <code>code</code> —
   fonctionne à l'intérieur des chaînes `body`.
   ------------------------------------------------------------------------- */
const PRACTICAL = [
  {
    heading: "Récupérer les supports",
    body: `Tout ce qui figure sur cette page se trouve dans
      <a href="${REPO}">un unique dépôt</a>.
      Vous pouvez télécharger les fichiers un par un, mais il est plus simple de cloner

  },
  {
    heading: "Environnement de travail",
    body: `Tout le cours se fait sur
      <a href="https://colab.research.google.com/">Google Colab</a>, dans le navigateur :
      aucune installation, aucune version de Python à gérer. Un compte Google suffit.
      Le travail en local est possible mais non assisté — les séances de TD ne sont pas
      consacrées au dépannage d'installations.`
  },
  {
    heading: "Poser une question",
    body: `Utilisez les <a href="${REPO}/issues">Issues</a> pour tout ce qui touche au code
      ou au matériel : si une personne est bloquée, plusieurs le sont en général, et la réponse
      reste là où chacun peut la retrouver. Indiquez toujours le message d'erreur complet.
      Écrivez-moi directement pour tout ce qui est personnel — absence, délai, note.`
  },
  {
    heading: "Assessment",
    body: `Contrôle continu 50 %, contrôle terminal 50 %. Détails dans le
     <a href="${REPO}/blob/main/syllabus.md">syllabus</a>.`

/* =========================================================================
   Sous cette ligne se trouve la mécanique qui dessine la page.
   Il ne devrait pas être nécessaire d'y toucher.
   ========================================================================= */
(function () {
  "use strict";

  const DAY = 86400000;
  const now = new Date();

  const fmtDate = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short" });
  const fmtDateTime = new Intl.DateTimeFormat("fr-FR", {
    weekday: "short", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit"
  });

  function el(tag, className, html) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (html != null) node.innerHTML = html;
    return node;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function daysBetween(a, b) {
    return Math.round((b - a) / DAY);
  }

  /* ---- en-tête ---- */
  document.title = COURSE.code + " — " + COURSE.title;
  document.getElementById("course-code").textContent = COURSE.code;
  document.getElementById("course-title").textContent = COURSE.title;

  const factsEl = document.getElementById("course-facts");
  COURSE.facts.forEach(f => {
    factsEl.appendChild(el("li", null,
      "<b>" + escapeHtml(f.label) + "</b>" + escapeHtml(f.value)));
  });

  /* ---- où en est-on dans le semestre ? ---- */
  const weeks = SCHEDULE.map(w => ({ ...w, start: new Date(w.date + "T00:00") }));
  let currentIndex = -1;
  weeks.forEach((w, i) => {
    const next = weeks[i + 1] ? weeks[i + 1].start : new Date(w.start.getTime() + 7 * DAY);
    if (now >= w.start && now < next) currentIndex = i;
  });

  /* ---- calendrier ---- */
  const scheduleEl = document.getElementById("schedule");
  weeks.forEach((w, i) => {
    const li = el("li", "week");
    if (i === currentIndex) li.classList.add("is-now");
    else if (currentIndex > -1 && i < currentIndex) li.classList.add("is-past");
    else if (currentIndex === -1 && now > w.start) li.classList.add("is-past");

    const mark = el("div", "week-mark",
      "Séance " + w.week + "<span class='week-dot'></span>" + fmtDate.format(w.start));
    li.appendChild(mark);

    const body = el("div", "week-body");
    if (i === currentIndex) body.appendChild(el("span", "now-tag", "Cette semaine"));
    body.appendChild(el("h3", null, escapeHtml(w.topic)));
    if (w.summary) body.appendChild(el("p", null, escapeHtml(w.summary)));
    if (w.td) body.appendChild(el("p", "week-td", "<b>Travaux dirigés</b>" + escapeHtml(w.td)));

    if (w.links && w.links.length) {
      const links = el("div", "week-links");
      w.links.forEach(l => {
        const a = el("a", null, escapeHtml(l.label));
        a.href = l.href;
        links.appendChild(a);
      });
      body.appendChild(links);
    }
    li.appendChild(body);
    scheduleEl.appendChild(li);
  });

  /* ---- format des travaux dirigés ---- */
  const tdEl = document.getElementById("td-format");
  TD_FORMAT.forEach(t => {
    const div = el("div");
    div.appendChild(el("h3", null, escapeHtml(t.heading)));
    div.appendChild(el("p", null, t.body));
    tdEl.appendChild(div);
  });

  /* ---- informations pratiques ---- */
  const practicalEl = document.getElementById("practical");
  PRACTICAL.forEach(p => {
    const div = el("div");
    div.appendChild(el("h3", null, escapeHtml(p.heading)));
    div.appendChild(el("p", null, p.body));
    practicalEl.appendChild(div);
  });

  /* ---- bandeau de situation ---- */
  const statusEl = document.getElementById("status");
  const mainEl = document.getElementById("status-main");
  const subEl = document.getElementById("status-sub");

  if (currentIndex > -1) {
    const w = weeks[currentIndex];
    mainEl.textContent = "Séance " + w.week + " — " + w.topic;
  } else if (weeks.length && now < weeks[0].start) {
    statusEl.classList.add("is-pre");
    const d = daysBetween(now, weeks[0].start);
    mainEl.textContent = "Le cours débute le " + fmtDate.format(weeks[0].start);
    subEl.innerHTML = d === 1 ? "Demain." : "Dans " + d + " jours.";
  } else {
    statusEl.classList.add("is-pre");
    mainEl.textContent = "Les enseignements du semestre sont terminés.";
  }

  if (currentIndex > -1 && weeks[currentIndex].td) {
    subEl.textContent = "TD cette semaine";
  }

  /* ---- pied de page ---- */
  document.getElementById("footer-line").innerHTML =
    escapeHtml(COURSE.code) + " · Sources et supports sur " +
    "<a href='" + COURSE.repoUrl + "'>GitHub</a> · Dernière mise à jour le " +
    fmtDate.format(new Date(document.lastModified));
})();
</script>
</body>
</html>
